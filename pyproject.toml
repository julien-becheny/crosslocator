[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosslocator"
version = "0.1.0"
description = "Define a UI selector once, resolve it on every platform (Android, iOS, iPadOS, Windows, web)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Julien Becheny" }]
keywords = [
    "test-automation",
    "appium",
    "robotframework",
    "playwright",
    "mobile-testing",
    "android",
    "ios",
    "windows",
    "locators",
    "selectors",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Framework :: Robot Framework :: Library",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/julien-becheny/crosslocator"
Repository = "https://github.com/julien-becheny/crosslocator"
Issues = "https://github.com/julien-becheny/crosslocator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crosslocator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
